<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>魔女の大釜 3Dガチャ - 同期・引継ぎ完全版</title>
    <style>
        body {
            margin: 0; overflow: hidden; background-color: #1a120b;
            color: #d4d4d4; font-family: 'Times New Roman', serif; user-select: none;
        }
        #canvas-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; cursor: grab;
        }
        #canvas-container:active { cursor: grabbing; }
        
        /* UIレイアウト（絶対配置で見切れを防止） */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 10; pointer-events: none; box-sizing: border-box;
        }
        
        /* 左上：ステータス */
        .header-status {
            position: absolute; top: 20px; left: 20px;
            background: rgba(20, 15, 10, 0.9); padding: 12px 15px;
            border: 1px solid #5a3d2b; border-radius: 5px; width: 240px;
            pointer-events: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .exp-bar-container {
            width: 100%; height: 8px; background: #222; margin-top: 5px; border-radius: 4px; overflow: hidden;
        }
        #exp-bar { width: 0%; height: 100%; background: #4caf50; transition: width 0.3s; }
        
        /* 右上：冒険の献立に戻るボタン */
        #back-to-menu {
            position: absolute; top: 20px; right: 20px;
            background: #3d2817; color: #ebd5b3; border: 1px solid #7c5c43;
            padding: 10px 15px; font-size: 14px; text-decoration: none;
            border-radius: 5px; pointer-events: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            font-family: 'Times New Roman', serif; transition: background 0.2s;
        }
        #back-to-menu:hover { background: #5a3d2b; }

        /* 左下：大釜に材料を投入するボタン */
        #toss-btn {
            position: absolute; bottom: 200px; left: 20px;
            pointer-events: auto; background: #3d2817; color: #ebd5b3;
            border: 2px solid #4caf50; padding: 15px 20px; font-size: 16px; font-weight: bold;
            cursor: pointer; border-radius: 8px; font-family: 'Times New Roman', serif;
            transition: all 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            max-width: calc(100vw - 40px); box-sizing: border-box;
        }
        #toss-btn:disabled { background: #1a120b; color: #555; border-color: #333; box-shadow: none; cursor: not-allowed; }

        /* システム起動＆NFC待機オーバーレイ */
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); z-index: 100;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
        }
        #start-overlay button {
            background: #4a86e8; color: white; border: none; padding: 20px 40px;
            font-size: 20px; border-radius: 10px; cursor: pointer; box-shadow: 0 0 15px rgba(74, 134, 232, 0.5);
        }

        /* アイテムポップアップ */
        .item-popup {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            z-index: 9999;
            background: radial-gradient(circle, #fffbd5, #b20a2c);
            border: 4px solid #d4af37; border-radius: 50%;
            width: 250px; height: 250px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #333; box-shadow: 0 0 50px rgba(255, 215, 0, 0.8);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            cursor: pointer; pointer-events: auto; text-align: center;
        }
        .item-popup h2 { margin: 0 0 10px 0; font-size: 26px; text-shadow: 1px 1px 2px #fff; }
        .item-popup p { font-size: 15px; margin: 0; font-weight: bold; }
        .item-popup .tap-hint { font-size: 12px; color: #666; margin-top: 15px; animation: blink 1.5s infinite; }

        @keyframes popIn { to { transform: translate(-50%, -50%) scale(1); } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

<div id="start-overlay">
    <h2 style="color:white; margin-bottom: 20px;">魔女の工房へようこそ</h2>
    <p style="color:#aaa; margin-bottom: 30px; font-size: 14px;">※音声が鳴ります</p>
    <button onclick="initSystem()">システム起動 ＆ NFC待機</button>
</div>

<div id="canvas-container"></div>

<div id="ui-layer">
    <!-- 左上のステータス -->
    <div class="header-status">
        <div style="font-size: 18px;">魔女の工房 <span id="level-display">Lv.1</span></div>
        <div style="font-size: 13px; margin-top: 4px;">EXP: <span id="exp-display">0 / 100</span></div>
        <div class="exp-bar-container"><div id="exp-bar"></div></div>
        <div style="margin-top: 10px; font-size: 16px; color: #66cc66;">
            蓄積時間(NFC): <span id="catalyst-display">0</span> 分
        </div>
    </div>
    
    <!-- 右上の戻るボタン -->
    <a href="https://adol896.github.io/The-Gamer-s-Feast/" id="back-to-menu">冒険の献立に戻る</a>

    <!-- 左下の投入ボタン -->
    <button id="toss-btn" onclick="tossCatalyst()" disabled>大釜に材料を投入する</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
    /* =========================================
       Web Audio API (効果音)
    ========================================= */
    let audioCtx;
    function playTone(freq, type, duration, startTimeOffset = 0, vol = 0.1) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + startTimeOffset);
        
        gain.gain.setValueAtTime(vol, audioCtx.currentTime + startTimeOffset);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + startTimeOffset + duration);
        
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + startTimeOffset);
        osc.stop(audioCtx.currentTime + startTimeOffset + duration);
    }

    const SE = {
        scan: () => { playTone(880, 'sine', 0.1, 0, 0.1); playTone(1760, 'sine', 0.2, 0.1, 0.1); },
        toss: () => { playTone(150, 'sawtooth', 0.5, 0, 0.2); playTone(100, 'square', 1.0, 0.2, 0.2); },
        pop: () => { playTone(523.25, 'sine', 0.1, 0, 0.1); playTone(659.25, 'sine', 0.1, 0.05, 0.1); playTone(783.99, 'sine', 0.3, 0.1, 0.1); },
        levelUp: () => {
            playTone(392.00, 'square', 0.15, 0, 0.1); playTone(392.00, 'square', 0.15, 0.15, 0.1);
            playTone(392.00, 'square', 0.15, 0.3, 0.1); playTone(523.25, 'square', 0.6, 0.45, 0.15);
        }
    };

    /* =========================================
       ゲームロジック (状態の引継ぎと同期)
    ========================================= */
    // 冒険者のレベル（zeldaPlayerLevel）および経験値（zeldaPlayerExp）をLocalStorageから完全に引き継ぐ
    let playerLevel = parseInt(localStorage.getItem('zeldaPlayerLevel') || '1');
    let playerExp = parseInt(localStorage.getItem('zeldaPlayerExp') || '0');
    let expToNext = 100 * playerLevel; 
    let catalystTime = 0;

    const gachaPool = [
        { name: "名もなき剣士の錆びた剣", rarity: "N", desc: "小量の魔力を得た" },
        { name: "カボチャ頭の怪しい種", rarity: "SR", desc: "中量の魔力を得た" },
        { name: "骸骨王の呪われた王冠", rarity: "SSR", desc: "大量の魔力を得た！" }
    ];

    function updateUI() {
        document.getElementById('level-display').innerText = `Lv.${playerLevel}`;
        document.getElementById('exp-display').innerText = `${playerExp} / ${expToNext}`;
        document.getElementById('exp-bar').style.width = `${Math.min(100, (playerExp / expToNext) * 100)}%`;
        document.getElementById('catalyst-display').innerText = catalystTime;
        document.getElementById('toss-btn').disabled = (catalystTime <= 0);
    }

    function saveState() {
        localStorage.setItem('zeldaPlayerLevel', playerLevel);
        localStorage.setItem('zeldaPlayerExp', playerExp);
    }

    function addExp(amount) {
        playerExp += amount;
        // 連続レベルアップ対応
        while (playerExp >= expToNext) {
            playerExp -= expToNext; 
            playerLevel++; 
            expToNext = Math.floor(100 * playerLevel); // 次の必要EXP
            setTimeout(() => { SE.levelUp(); }, 300);
        }
        saveState();
        updateUI();
    }

    async function initSystem() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if ('NDEFReader' in window) {
            try {
                const ndef = new NDEFReader(); await ndef.scan();
                document.getElementById('start-overlay').style.display = 'none';
                ndef.onreading = event => { SE.scan(); catalystTime += 60; updateUI(); };
            } catch (error) {
                alert("NFCリーダー起動失敗。スマホでNFCをONにしてください。");
            }
        } else {
            document.getElementById('start-overlay').style.display = 'none';
            // PC用裏技：右下クリックでNFC仮想タッチ（+60分）
            window.addEventListener('click', (e) => {
                if(e.clientX > window.innerWidth - 100 && e.clientY > window.innerHeight - 100) {
                    SE.scan(); catalystTime += 60; updateUI();
                }
            });
        }
    }

    /* =========================================
       Three.js 構築 (背景・装飾・大釜)
    ========================================= */
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x1a120b, 0.02);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(12, 12, 16);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 3, 0);
    controls.maxPolarAngle = Math.PI / 2 - 0.05;
    controls.minDistance = 5; controls.maxDistance = 40;
    controls.enableDamping = true; controls.dampingFactor = 0.05;

    // --- ライト ---
    scene.add(new THREE.AmbientLight(0xffebd6, 0.5));
    const roomLight = new THREE.PointLight(0xffa550, 1.2, 40);
    roomLight.position.set(10, 15, -5); roomLight.castShadow = true; scene.add(roomLight);
    const cauldronLight = new THREE.PointLight(0x00ff00, 3, 15);
    cauldronLight.position.set(0, 4, 0); scene.add(cauldronLight);

    // --- テクスチャ生成 ---
    function createWoodTexture() {
        const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#4a2f1a'; ctx.fillRect(0,0,256,256);
        ctx.fillStyle = '#3a1f0a';
        for(let i=0; i<256; i+=32) ctx.fillRect(i, 0, 2, 256);
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(10, 10);
        return tex;
    }
    function createCarpetTexture() {
        const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
        const ctx = canvas.getContext('2d');
        const grad = ctx.createRadialGradient(256,256,0, 256,256,256);
        grad.addColorStop(0, '#8b1c1c'); grad.addColorStop(1, '#4a0505');
        ctx.fillStyle = grad; ctx.fillRect(0,0,512,512);
        ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 20; ctx.strokeRect(10,10,492,492);
        return new THREE.CanvasTexture(canvas);
    }

    // --- 背景モデル ---
    const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(50, 50),
        new THREE.MeshStandardMaterial({ map: createWoodTexture(), roughness: 0.9 })
    );
    floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

    const carpet = new THREE.Mesh(
        new THREE.PlaneGeometry(16, 16),
        new THREE.MeshStandardMaterial({ map: createCarpetTexture(), roughness: 1.0 })
    );
    carpet.rotation.x = -Math.PI / 2; carpet.position.y = 0.05; carpet.receiveShadow = true; scene.add(carpet);

    const shelf = new THREE.Mesh(
        new THREE.BoxGeometry(10, 12, 2),
        new THREE.MeshStandardMaterial({ color: 0x27140c })
    );
    shelf.position.set(-15, 6, -8); shelf.castShadow = true; scene.add(shelf);

    // --- 散らばった本 ---
    const bookGeo = new THREE.BoxGeometry(1, 0.2, 1.5);
    const bookColors = [0x551111, 0x112255, 0x114411, 0x555544, 0x664422];
    for(let i = 0; i < 20; i++) {
        const bCol = bookColors[Math.floor(Math.random() * bookColors.length)];
        const bMat = new THREE.MeshStandardMaterial({ color: bCol, roughness: 0.7 });
        const book = new THREE.Mesh(bookGeo, bMat);
        let bx, bz;
        do {
            bx = (Math.random() - 0.5) * 25;
            bz = (Math.random() - 0.5) * 25;
        } while (Math.sqrt(bx*bx + bz*bz) < 6);
        book.position.set(bx, 0.1, bz);
        book.rotation.y = Math.random() * Math.PI;
        book.castShadow = true;
        scene.add(book);
    }

    // --- ロウソクの燭台 ---
    function createCandle(x, z) {
        const candleGrp = new THREE.Group();
        const body = new THREE.Mesh(
            new THREE.CylinderGeometry(0.15, 0.15, 0.8, 8),
            new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.5 })
        );
        body.position.y = 0.4; body.castShadow = true; candleGrp.add(body);
        
        const flame = new THREE.Mesh(
            new THREE.ConeGeometry(0.1, 0.3, 8),
            new THREE.MeshBasicMaterial({ color: 0xffaa00 })
        );
        flame.position.y = 0.95; candleGrp.add(flame);
        
        const light = new THREE.PointLight(0xffaa00, 1.2, 12);
        light.position.y = 1.0; candleGrp.add(light);
        
        candleGrp.position.set(x, 0, z);
        return candleGrp;
    }
    scene.add(createCandle(8, 6));
    scene.add(createCandle(-7, 4));
    scene.add(createCandle(-3, 8));
    scene.add(createCandle(6, -5));

    // --- 大釜モデル ---
    const cauldron = new THREE.Mesh(
        new THREE.SphereGeometry(3, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2),
        new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9, metalness: 0.7 })
    );
    cauldron.rotation.x = Math.PI; cauldron.position.y = 3; cauldron.castShadow = true;
    scene.add(cauldron);

    const liquid = new THREE.Mesh(
        new THREE.CircleGeometry(2.8, 32),
        new THREE.MeshBasicMaterial({ color: 0x33ff33, transparent: true, opacity: 0.8 })
    );
    liquid.rotation.x = -Math.PI / 2; liquid.position.y = 2.8; scene.add(liquid);

    const particleCount = 200;
    const posArray = new Float32Array(particleCount * 3);
    for(let i=0; i<particleCount*3; i++) posArray[i] = (Math.random()-0.5)*5;
    const particleGeo = new THREE.BufferGeometry();
    particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const particles = new THREE.Points(particleGeo, new THREE.PointsMaterial({
        size: 0.15, color: 0x55ff55, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending
    }));
    particles.position.y = 3; scene.add(particles);

    // --- アニメーション ---
    let isGachaRunning = false;
    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        
        liquid.position.y = 2.8 + Math.sin(Date.now() * 0.002) * 0.05;
        
        const positions = particles.geometry.attributes.position.array;
        let speedMult = isGachaRunning ? 4.0 : 0.5; 
        for(let i=0; i<particleCount; i++) {
            positions[i*3+1] += 0.02 * speedMult; 
            if(positions[i*3+1] > 3) { 
                positions[i*3+1] = 0; positions[i*3] = (Math.random()-0.5)*4; positions[i*3+2] = (Math.random()-0.5)*4; 
            }
        }
        particles.geometry.attributes.position.needsUpdate = true;
        cauldronLight.intensity = 3 + Math.sin(Date.now() * 0.005) * (isGachaRunning ? 3 : 1);

        renderer.render(scene, camera);
    }
    animate();

    /* =========================================
       ガチャロジック
    ========================================= */
    function tossCatalyst() {
        if (catalystTime <= 0 || isGachaRunning) return;

        SE.toss();
        let spentTime = catalystTime;
        catalystTime = 0;
        updateUI();

        isGachaRunning = true;
        
        const selectedItem = gachaPool[Math.floor(Math.random() * gachaPool.length)];
        
        setTimeout(() => {
            showItemPopup(selectedItem);
            
            let expGained = spentTime * 2; 
            if(selectedItem.rarity === 'SR') expGained = Math.floor(expGained * 1.5);
            if(selectedItem.rarity === 'SSR') expGained = expGained * 2;
            
            addExp(expGained);
            isGachaRunning = false;
        }, 2000);
    }

    function showItemPopup(item) {
        SE.pop();
        const popup = document.createElement('div');
        popup.className = 'item-popup';
        popup.innerHTML = `
            <h2 style="color: ${item.rarity === 'SSR' ? '#ff44ff' : item.rarity === 'SR' ? '#ffbb00' : '#4488ff'}">${item.name}</h2>
            <p>${item.rarity}</p>
            <p style="font-size: 13px; margin-top:8px;">${item.desc}</p>
            <div class="tap-hint">タップして閉じる</div>
        `;
        popup.addEventListener('click', () => { playTone(880, 'triangle', 0.1); popup.remove(); });
        document.body.appendChild(popup);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    updateUI();
</script>
</body>
</html>
